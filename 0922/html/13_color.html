<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            body {
                background-color: #d38686;
            }
            p {
                color: red;
            }
            .color01 {
                background-color: blue;
            }
            .color02 {
                background-color: #202241;
            }
            .color03 {
                background-color: rgb(0 0 0);
            }
            .color04 {
                background-color: rgba(99, 20, 92, 0.4);
            }
            /* alpha: 0 ~ 1 */
            .color05 {
                color: #3fff25;
                background-color: #fff;
                opacity: 0.7;
            }
            /* opacity: 0 ~ 1 */
        </style>
    </head>
    <body>
        <h1>CSS Color Chart</h1>

        <!-- p.color$$*10{color$$} -->
        <p class="color01">color01</p>
        <p class="color02">color02</p>
        <p class="color03">color03</p>
        <p class="color04">color04</p>
        <p class="color05">color05</p>
        <p class="color06">color06</p>
        <p class="color07">color07</p>
        <p class="color08">color08</p>
        <p class="color09">color09</p>
        <p class="color10">color10</p>
    </body>
</html>
