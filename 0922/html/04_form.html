<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>입력 방식</title>
    </head>
    <body>
        <form>아이디: <input type="text" /> 비밀번호: <input type="password" /></form>
        <form action=""><input type="text" /> - 이름 <input type="text" /> - 학번</form>
        <hr />

        <form>
            <label for="user">아이디</label>
            <input type="text" id="user" />
            <br />
            <label for="pass">비밀번호</label>
            <input type="password" id="pass" />
        </form>
        <hr />
        <form>
            <fieldset>
                <legend>정보 입력</legend>
                아이디: <input type="text" /> <br />
                패스워드: <input type="password" /> <br />
                이메일: <input type="email" /> <br />
                URL: <input type="url" /> <br />
                전화번호: <input type="tel" /> <br />
                색상: <input type="color" /> <br />
                월: <input type="month" /> <br />
                날짜: <input type="date" /> <br />
                주: <input type="week" /> <br />
                시간: <input type="time" /> <br />
                지역 시간: <input type="datetime-local" /> <br />
                숫자: <input type="number" min="200" max="320" step="5" /> <br />
                범위: <input type="range" min="0" max="10" step="2" /> <br />
                <input type="submit" value="보내기" />
                <input type="reset" value="다시" />
                <input type="button" value="버튼" />
            </fieldset>
        </form>

        <button>버튼</button>

        <button onclick="alert('전송되었습니다.')">
            <img src="../img/button.jpg" width="50" alt="빨간색 3D 버튼" />
        </button>
    </body>
</html>
