<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* 선택자 {속성: 속성값; } */
            h1 {
                color: red;
            }
            #blue {
                color: blue;
            }

            p {
                color: pink;
            }
            .black {
                background-color: black;
                color: red;
            }
        </style>
    </head>
    <body>
        <h1>안녕하세요.</h1>
        <h2>반갑습니다.</h2>
        <h1 id="blue">열심히 공부합시다.</h1>
        <p>또 만나요.</p>
        <p>점심 맛있게 드셨나요?</p>
        <p class="black">저녁 맛있게 드셨나요?</p>
        <p>아침 맛있게 드셨나요?</p>
        <p class="black">간식 맛있게 드셨나요?</p>
        <p class="black">야식 맛있게 드셨나요?</p>

        <!--
            선택자: { 속성: 속성값; }

            선택자의 종류
            1) 태그   - h1 { --- }
            2) 아이디 - #id { --- }
            3) 클래스 - .class { --- }

            아이디, 클래스 이름 만들 때 규칙
            - 금지 -
            1) 한글 X
            2) 숫자 + 영문 X
            3) 띄어쓰기 X
            4) 특수문자 X
            5) 첫 글자 대문자 X
            6) 의미 없는 글자 X (ex: aaa, bbb, zzz ...)

            - 가능 -
            1) 영문 + 숫자
            2) 특수문자 (-, _)
            3) 팀원들이 서로 이해할 수 있는 의미 있는 단어 (ex: banner, item ...)
            4) 

        -->
    </body>
</html>
