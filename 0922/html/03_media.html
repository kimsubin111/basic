<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>오디오, 비디오 가져오기</title>
    </head>
    <body>
        <h1>오디오 가져오기</h1>
        <audio src="../media/EXO.mp3" controls></audio>

        <h1>비디오 가져오기</h1>
        <video src="../media/2-1.mp4" controls width="500"></video>

        <video controls width="500">
            <source src="../media/2-1.mp4" />
        </video>
        <!-- 
        autoplay muted = 자동으로 재생
        poster = 썸네일 이미지
        -->
    </body>
</html>
