<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Web Site</title>
    </head>
    <body>
        <!-- p 태그는 단락 태그. 브라우저의 한 줄 전체를 차지한다. -->
        <p>안녕하세요</p>
        <p>반갑습니다</p>
        <p>또 만나요</p>
        <!-- 주석 만들기 -->
        <!-- ctrl + / -->
        <!-- 주석은 브라우저에 출력이 안 된다. 편의에 따라서 필요하다. -->
        <p>
            공공필요에 의한 재산권의 수용·사용 또는 제한 및 그에 대한 보상은 법률로써 하되, 정당한 보상을 지급하여야
            한다. <br />
            법관이 중대한 심신상의 장해로 직무를 수행할 수 없을 때에는 법률이 정하는 바에 의하여 퇴직하게 할 수 있다.
        </p>
        <!-- br 강제 줄 바꿈 -->
    </body>
</html>
