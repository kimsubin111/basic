<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            /* reset */
            * {
                margin: 0;
                padding: 0;
            }

            div {
                width: 100px;
                height: 100px;
                text-align: center;
                line-height: 100px;
                font-weight: bold;
            }

            div:nth-child(1) {
                background-color: red;
            }
            div:nth-child(2) {
                background-color: yellow;
                margin: 20px;
                /* margin: top right bottom left */
                /* margin-top: 20px;
                margin-left: 20px;
                margin-right: 20px;
                margin-bottom: 20px; */
            }
            div:nth-child(3) {
                background-color: green;
                padding: 20px;
            }
            div:nth-child(4) {
                background-color: blue;
                border: 10px solid black;
            }
            div:nth-child(5) {
                background-color: purple;
                margin: 20px;
                padding: 20px;
                border: 10px solid black;
            }

            /* 
            total Width = content의 width 값 + (margin + padding + border) X 2
            */
            #big {
                width: 140px;
                height: 140px;
                background-color: skyblue;
                padding: 30px;
            }
            #small {
                width: 100px;
                height: 100px;
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <div>BOX 1</div>
        <div>BOX 2</div>
        <div>BOX 3</div>
        <div>BOX 4</div>
        <div>BOX 5</div>

        <section id="big">
            <section id="small"></section>
        </section>
    </body>
</html>
