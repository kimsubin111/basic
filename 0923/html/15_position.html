<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            * {
                margin: 0;
                padding: 0;
            }

            div {
                width: 100px;
                height: 100px;
            }

            #box01 {
                background-color: red;
            }
            #box02 {
                background-color: blue;
                position: absolute;
                left: 10px;
                top: 10px;
                z-index: 1;
            }
            #box03 {
                background-color: green;
                position: absolute;
                left: 20px;
                top: 20px;
                z-index: 2;
            }
            #box04 {
                background-color: orange;
                position: absolute;
                left: 50px;
                top: 50px;
            }
        </style>
    </head>
    <body>
        <!-- #box$$*4{$} -->
        <div id="box01">1</div>
        <div id="box02">2</div>
        <div id="box03">3</div>
        <div id="box04">4</div>

        <!-- 
        *** position ***
        1) static
        2) absolute
        3) relative
        4) fixed
        -->
    </body>
</html>
