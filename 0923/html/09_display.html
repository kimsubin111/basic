<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            div {
                width: 100px;
                height: 100px;
                background-color: red;
                border: 2px solid #000;

                display: inline-block;
            }

            h1,
            p {
                display: inline;
            }

            span {
                display: block;
                width: 100px;
                height: 100px;
                background-color: yellow;
            }

            img {
                display: block;
            }

            /* block: 브라우저의 전체를 차지. ex) p, h1~6, form, ul, li, div 등등 */
            /* lnline: 그 요소의 공간만 차지. ex) span, img, b, i, em, strong, input 등등 */
            /* inline-block: inline 속성과 block의 속성을 함께 가지고 있다. */
        </style>
    </head>
    <body>
        <!-- 블럭 / 인라인 -->
        <div>블럭</div>
        <div>블럭</div>
        <div>블럭</div>
        <div>블럭</div>
        <div>블럭</div>

        <h1>1111111111111</h1>
        <p>11111111111111</p>

        <span>동해물과</span>
        <span>백두산이</span>
        <span>마르고</span>
        <span>닳도록</span>

        <hr />

        <img src="../img/puppy.jpg" alt="" width="200" />
        <img src="../img/puppy2.jpg" alt="" width="200" />
        <img src="../img/puppy3.jpg" alt="" width="200" />
        <img src="../img/puppy4.jpg" alt="" width="200" />
        <img src="../img/puppy5.jpg" alt="" width="200" />
    </body>
</html>
