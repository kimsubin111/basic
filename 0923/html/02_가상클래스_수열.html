<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=
        , initial-scale=1.0"
        />
        <title>Document</title>
        <style>
            h3:hover {
                color: red;
            }
            li {
                list-style: none;
                font-size: 30px;
                font-weight: bold;
            }

            li:first-child {
                color: rgb(255, 0, 43);
            }
            li:nth-child(2) {
                color: rgb(255, 238, 0);
            }
            li:nth-child(3) {
                color: rgb(98, 0, 255);
            }
            li:nth-child(4) {
                color: rgb(187, 255, 0);
            }
            li:nth-child(5) {
                color: rgb(255, 0, 0);
            }
            li:nth-child(6) {
                color: rgb(255, 0, 221);
            }
            li:nth-child(7) {
                color: rgb(0, 255, 157);
            }
            li:nth-child(8) {
                color: rgb(225, 0, 255);
            }
            li:nth-child(9) {
                color: rgb(255, 94, 0);
            }
            li:last-child {
                color: rgb(0, 238, 255);
            }
        </style>
    </head>
    <body>
        <h2>가상 클래스 (의사 클래스)</h2>
        <h3>마우스 오버</h3>

        <ul>
            <li>001</li>
            <li>002</li>
            <li>003</li>
            <li>004</li>
            <li>005</li>
            <li>006</li>
            <li>007</li>
            <li>008</li>
            <li>009</li>
            <li>010</li>
        </ul>
    </body>
</html>
