<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            .tomato {
                display: none;
                /* 존재의 유무: 있다. / 없다. */
            }
            .cheese {
                visibility: hidden;
                /* 가시성: 보인다. / 안 보인다. */
            }
            .lettuce {
                opacity: 0;
                /* 투명도: 0 ~ 1 */
            }
        </style>
    </head>
    <body>
        <div>햄버거 빵</div>
        <div class="cheese">치즈</div>
        <div>소고기 패티</div>
        <div class="tomato">토마토</div>
        <div class="lettuce">양상추</div>
        <div>햄버거 빵</div>
    </body>
</html>
