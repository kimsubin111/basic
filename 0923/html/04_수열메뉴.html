<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <style>
            li {
                list-style: none;
                width: 100px;
                height: 50px;
                background-color: #ff0000;
                color: #000000;
                border: 1px solid #000;
                text-align: center;
                line-height: 50px;
                float: left;
            }
            li:nth-child(2n-1) {
                background-color: red;
            }
            li:nth-child(2n) {
                background-color: blue;
            }
            li:first-child {
                border-radius: 30px 0 0 30px;
            }
            li:last-child {
                border-radius: 0 30px 30px 0;
            }
        </style>
    </head>
    <body>
        <ul>
            <li>menu00</li>
            <li>menu01</li>
            <li>menu02</li>
            <li>menu03</li>
            <li>menu04</li>
            <li>menu05</li>
            <li>menu06</li>
            <li>menu07</li>
            <li>menu08</li>
            <li>menu09</li>
            <li>menu10</li>
            <li>menu11</li>
        </ul>
    </body>
</html>
