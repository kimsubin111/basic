<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>layout02 - flex</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #wrap {
        width: 900px;
        margin: 0 auto;
        background-color: yellow;
        display: flex;
        /* justify-content: space-between; */
        gap: 10px;
      }
      #header {
        width: 290px;
        height: 600px;
        background-color: #00ca8e;

        /* margin-right: 10px; */
      }
      #section01 {
        width: 600px;
        height: 100px;
        background-color: #3feeb9;
      }
      #section02 {
        width: 600px;
        height: 380px;
        background-color: #03805a;

        margin: 10px 0;
      }
      #section03 {
        width: 600px;
        height: 100px;
        background-color: #528d7b;
      }
      #footer {
        width: 900px;
        height: 100px;
        background-color: red;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header id="header">header</header>
      <main id="main">
        <section id="section01">section01</section>
        <section id="section02">section02</section>
        <section id="section03">section03</section>
      </main>
    </div>
    <footer id="footer">footer</footer>
  </body>
</html>
