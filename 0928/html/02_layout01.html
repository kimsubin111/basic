<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>layout - flex</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #wrap {
        width: 900px;
        background-color: yellow;
        margin: 0 auto;
      }
      #header {
        /* width: 900px; */
        height: 80px;
        background-color: #2d17f7;
        margin-bottom: 10px;
      }
      #main {
        display: flex;
        gap: 10px;
      }
      #nav {
        width: 300px;
        height: 500px;
        background-color: #5096ff;
      }
      #content {
        width: 590px;
        height: 500px;
        background-color: #60fff2;

        margin-bottom: 10px;
      }
      #footer {
        /* width: 900px; */
        /* width: 100%; */
        height: 80px;
        background-color: #87f1ff;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header id="header">header</header>
      <main id="main">
        <nav id="nav">nav</nav>
        <section id="content">content</section>
      </main>
      <footer id="footer">footer</footer>
    </div>
  </body>
</html>
