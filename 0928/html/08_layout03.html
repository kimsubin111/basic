<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>layout3 - float</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      #wrap {
        width: 900px;
        background-color: gray;
        margin: 0 auto;
      }
      #header {
        width: 100%;
        height: 80px;
        background-color: #ff0da2;
      }
      #main {
        width: 100%;
        overflow: hidden;
        /* 자식을 감싼다. - 부모한테 */
      }
      #main #section01 {
        width: 300px;
        height: 500px;
        background-color: #ff44b7;
        float: left;
      }
      #main #section02 {
        width: 300px;
        height: 500px;
        background-color: #fa8cd0;
        float: left;
      }
      #main #section03 {
        width: 300px;
        height: 500px;
        background-color: #ffbae5;
        float: left;
      }
      #footer {
        width: 100%;
        height: 80px;
        background-color: #4e0131;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <header id="header">header</header>
      <main id="main">
        <section id="section01">section01</section>
        <section id="section02">section02</section>
        <section id="section03">section03</section>
      </main>
      <footer id="footer">footer</footer>
    </div>
  </body>
</html>
